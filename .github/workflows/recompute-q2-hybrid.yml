name: Recompute Q2 Hybrid

on:
  push:
    branches: [main]
    paths:
      - '问题二/脚本/求解问题二_分层稳健.py'

permissions:
  contents: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy openpyxl

      - name: Recompute problem 2
        run: python "问题二/脚本/求解问题二_分层稳健.py"

      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "问题二/结果/七天六品类最终策略_分层稳健.csv" \
            "问题二/结果/策略分解_分层稳健.csv" \
            "问题二/结果/价格关系可靠性_分层稳健.csv" \
            "问题二/结果/基础需求模型回测_分层稳健.csv" \
            "问题二/结果/基础需求模型回测汇总_分层稳健.csv" \
            "问题二/最终建模说明_分层稳健.md"
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "重算问题二分层稳健方案 [skip q2-auto]"
            git push
          fi
